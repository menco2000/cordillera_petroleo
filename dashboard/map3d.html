<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cordillera 3D Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: a calm, tilted relief of South America fills the screen. One solid bar per site
   (height = oil production, color = status). A small header and a footer line are the only chrome;
   everything else is in PI Vision. Flat shading, no glow. */
:root {
  --bg: #e8ecf0;
  --land: #fbfcfd;
  --wall: #c3ccd4;
  --wall-2: #b2bcc6;
  --border: #9aa8b5;
  --other: #dde3e8;
  --ink: #16202a;
  --ink-2: #4c5966;
  --muted: #74818d;
  --chip: rgba(255, 255, 255, 0.92);
  --line: #d3dae1;
  --accent: #1f5f8b;
  --halo: #ffffff;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --planned: #8a96a1;
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --land: #232d37; --wall: #161d24; --wall-2: #10161c; --border: #4a5866; --other: #1a2129;
    --ink: #edf2f6; --ink-2: #b6c2cc; --muted: #8592a0; --chip: rgba(24, 31, 39, 0.94); --line: #2c3742; --accent: #7cc0ea; --halo: #11161c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --land: #232d37; --wall: #161d24; --wall-2: #10161c; --border: #4a5866; --other: #1a2129;
  --ink: #edf2f6; --ink-2: #b6c2cc; --muted: #8592a0; --chip: rgba(24, 31, 39, 0.94); --line: #2c3742; --accent: #7cc0ea; --halo: #11161c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.land-top { fill: var(--land); stroke: var(--border); stroke-width: 0.8; stroke-linejoin: round; }
.land-wall { fill: var(--wall); }
.land-base { fill: var(--wall-2); }
.land-other { fill: var(--other); stroke: none; }
.bar { cursor: pointer; }
.bar:focus { outline: none; }
.bar:focus-visible .front { stroke: var(--accent); stroke-width: 2.5; }
.bar polygon { stroke: rgba(0, 0, 0, .28); stroke-width: .8; stroke-linejoin: round; }
.lbl { fill: var(--ink); font-family: var(--font); font-weight: 600; paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.lbl tspan.v { fill: var(--ink-2); font-weight: 500; }
.flow { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 5; fill: none; }

header.top { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none; }
header.top > * { pointer-events: auto; }
.title h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -.005em; }
.title p { margin: 3px 0 0; font-size: .92rem; color: var(--ink-2); }
.title p b { color: var(--ink); font-variant-numeric: tabular-nums; }
.title button { font: inherit; font-size: .88rem; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; margin-bottom: 4px; cursor: pointer; }
.title button:hover { text-decoration: underline; }
.pv { display: inline-flex; align-items: center; gap: 7px; font-size: .86rem; font-weight: 600; color: #fff; background: var(--accent); border-radius: 8px; padding: 8px 13px; text-decoration: none; white-space: nowrap; }
.pv:hover { filter: brightness(1.08); }
:root[data-theme="dark"] .pv { color: #0b1620; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pv { color: #0b1620; } }
footer.bottom { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 10px 18px; flex-wrap: wrap; font-size: .78rem; color: var(--ink-2); pointer-events: none; }
footer.bottom > * { pointer-events: auto; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
#designs { display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--chip); border: 1px solid var(--line); }
#designs a { color: var(--ink-2); text-decoration: none; padding: 4px 11px; border-radius: 6px; }
#designs a.on { background: var(--ink); color: var(--bg); font-weight: 600; }
#asof { color: var(--muted); font-variant-numeric: tabular-nums; }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 170px; max-width: 260px; font-size: .82rem; box-shadow: 0 4px 14px rgba(0,0,0,.10); display: grid; gap: 5px; justify-items: start; }
#tip h3 { margin: 0; font-size: .98rem; font-weight: 700; }
#tip .sub { color: var(--muted); font-size: .76rem; margin-top: -4px; }
#tip .num { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
#tip .num small { font-size: .78rem; font-weight: 500; color: var(--ink-2); }
#tip .why { color: var(--ink-2); font-size: .76rem; }
#tip .hint { color: var(--muted); font-size: .72rem; }
svg.ic { width: 12px; height: 12px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 7%, transparent); white-space: nowrap; }
@media (max-width: 640px) {
  .title h1 { font-size: 1rem; } .title p { font-size: .84rem; }
  header.top { flex-direction: column; } .pv { padding: 7px 11px; font-size: .8rem; }
  footer.bottom { justify-content: center; } #asof { width: 100%; text-align: center; order: 3; }
}
</style>
</head>
<body>
<svg id="stage" role="img" aria-label="3D map of Cordillera Petróleo sites"></svg>
<header class="top"><div class="title" id="title"></div><a class="pv" id="pv" target="_blank" rel="noopener" hidden>Open in PI Vision ↗</a></header>
<footer class="bottom"><div class="legend" id="legend"></div><nav id="designs" aria-label="Map designs"></nav><span id="asof"></span></footer>
<div id="tip" hidden></div>

<script src="config.js"></script>
<script src="data/model.js"></script>
<script src="data/map.js"></script>
<script src="data/demo.js"></script>
<script src="source.js"></script>
<script src="common.js"></script>
<script src="map3d.js"></script>
</body>
</html>
