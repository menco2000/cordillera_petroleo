<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cordillera Holo Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap">
<style>
/* Layout: a tilted, extruded South America floats in a dark blue field. Columns rise from each
   site (height = selected metric) with its wells as a small skyline. HUD panels sit at the edges;
   detail opens in a HUD window on hover. One deliberate dark look. */
:root {
  color-scheme: dark;
  --bg-0: #020812;
  --bg-1: #06182e;
  --hud: rgba(6, 22, 44, 0.82);
  --hud-line: rgba(80, 190, 255, 0.45);
  --ink: #e6f6ff;
  --ink-2: #9fc4dc;
  --muted: #5f86a3;
  --cyan: #36d6ff;
  --good: #36d6ff;
  --warning: #ffb627;
  --critical: #ff4b4b;
  --planned: #6f8aa0;
  --display: "Rajdhani", "Arial Narrow", system-ui, sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(ellipse 80% 70% at 50% 45%, var(--bg-1), var(--bg-0) 75%); color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.grat { stroke: rgba(70, 150, 220, 0.12); stroke-width: 1; fill: none; vector-effect: non-scaling-stroke; }
.land-top { fill: url(#landFill); stroke: rgba(120, 220, 255, 0.75); stroke-width: 1; vector-effect: non-scaling-stroke; }
.land-wall { fill: #0a3a6a; stroke: none; }
.land-glow { fill: #2fb8ff; filter: url(#glow); opacity: .85; }
.land-other { fill: none; stroke: rgba(90, 160, 220, 0.22); stroke-width: 1; vector-effect: non-scaling-stroke; }
.col { cursor: pointer; }
.col:focus { outline: none; }
.col:focus-visible .face-f { stroke: #fff; stroke-width: 1.5; }
.tag rect { fill: rgba(4, 18, 36, .78); stroke: var(--hud-line); }
.tag text { fill: var(--ink); font-family: var(--display); font-weight: 600; }
.tag .v { fill: var(--ink-2); font-family: var(--body); font-weight: 500; }
.flow { fill: none; stroke: var(--cyan); stroke-width: 1.6; stroke-dasharray: 6 8; opacity: .8; animation: flow 1.2s linear infinite; filter: url(#glowS); }
@keyframes flow { to { stroke-dashoffset: -14; } }

.hud { position: fixed; z-index: 10; background: var(--hud); border: 1px solid var(--hud-line); border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 24px rgba(40,160,255,.18), inset 0 0 30px rgba(40,140,255,.08);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.hud::before, .hud::after { content: ""; position: absolute; width: 10px; height: 10px; border: 2px solid var(--cyan); }
.hud::before { left: -2px; top: -2px; border-right: 0; border-bottom: 0; }
.hud::after { right: -2px; bottom: -2px; border-left: 0; border-top: 0; }
#panel { top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); padding: 12px 16px; min-width: 230px; display: grid; gap: 8px; }
#panel h1 { margin: 0; font-family: var(--display); font-size: 1.25rem; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
#panel h1 i { width: 8px; height: 8px; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); display: inline-block; }
#panel .big { font-family: var(--display); font-size: 2.1rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
#panel .big small { font-size: .9rem; color: var(--ink-2); font-weight: 600; margin-left: 4px; }
#panel .cap { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
#panel .counts { display: grid; gap: 3px; font-size: .82rem; }
#panel .counts div { display: flex; align-items: center; gap: 8px; }
#panel .counts b { font-family: var(--display); font-size: 1rem; margin-left: auto; font-variant-numeric: tabular-nums; }
#panel .sq { width: 9px; height: 9px; display: inline-block; }
#panel button { justify-self: start; font: inherit; font-size: .82rem; color: var(--cyan); background: none; border: 1px solid var(--hud-line); border-radius: 3px; padding: 4px 10px; cursor: pointer; }
#panel button:hover { background: rgba(54,214,255,.1); }
#tabs { top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 0; background: none; border: 0; box-shadow: none; backdrop-filter: none; }
#tabs::before, #tabs::after { display: none; }
#tabs button { font-family: var(--display); font-size: .95rem; font-weight: 600; letter-spacing: .04em; color: var(--ink-2); padding: 6px 18px; cursor: pointer;
  background: linear-gradient(180deg, rgba(20,60,110,.85), rgba(8,26,52,.85)); border: 1px solid var(--hud-line); border-radius: 3px; }
#tabs button[aria-pressed="true"] { color: #fff; border-color: var(--cyan); box-shadow: 0 0 14px rgba(54,214,255,.45), inset 0 0 10px rgba(54,214,255,.25); }
#compass { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); width: 128px; height: 128px; border-radius: 50%; padding: 0; }
#compass::before, #compass::after { display: none; }
#designs { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); padding: 4px; display: flex; gap: 2px; font-size: .78rem; }
#designs a { color: var(--ink-2); text-decoration: none; padding: 5px 10px; border-radius: 3px; white-space: nowrap; }
#designs a:hover { color: var(--ink); }
#designs a.on { color: #021018; background: var(--cyan); font-weight: 600; }
#asof { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); padding: 6px 12px; font-size: .76rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
#note { top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); padding: 8px 12px; font-size: .76rem; color: var(--ink-2); max-width: 320px; }
@media (max-width: 760px) { #tabs { top: auto; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); } #compass { display: none; } #note { top: auto; bottom: 110px; } #tabs button { padding: 5px 10px; font-size: .85rem; } }

#tip { z-index: 20; min-width: 240px; max-width: 320px; padding: 0 0 10px; font-size: .82rem; pointer-events: none; }
#tip .bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--hud-line); font-size: .72rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
#tip .bar span:last-child { color: var(--muted); }
#tip > :not(.bar) { margin-left: 12px; margin-right: 12px; }
#tip h3 { margin-top: 8px; margin-bottom: 4px; font-family: var(--display); font-size: 1.2rem; font-weight: 700; letter-spacing: .02em; }
#tip .kv { display: grid; grid-template-columns: auto auto; gap: 3px 14px; margin-top: 8px; }
#tip .kv span:nth-child(odd) { color: var(--ink-2); }
#tip .kv span:nth-child(even) { text-align: right; font-family: var(--display); font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .units { display: grid; gap: 4px; margin-top: 8px; }
#tip .units div { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
#tip .units .m { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: .78rem; }
#tip .why { margin-top: 8px; color: var(--ink-2); font-size: .78rem; }
#tip .hint { margin-top: 6px; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
svg.ic { width: 12px; height: 12px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 2px; background: rgba(54,214,255,.08); border: 1px solid rgba(54,214,255,.25); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<svg id="stage" role="img" aria-label="Tilted 3D map of Cordillera Petróleo sites"></svg>
<div class="hud" id="panel"></div>
<div class="hud" id="tabs" role="group" aria-label="Column height"></div>
<div class="hud" id="compass" aria-hidden="true"></div>
<nav class="hud" id="designs" aria-label="Map designs"></nav>
<div class="hud" id="asof"></div>
<div class="hud" id="note" hidden></div>
<div class="hud" id="tip" hidden></div>

<script src="config.js"></script>
<script src="data/model.js"></script>
<script src="data/map.js"></script>
<script src="data/demo.js"></script>
<script src="source.js"></script>
<script src="common.js"></script>
<script src="holo.js"></script>
</body>
</html>
