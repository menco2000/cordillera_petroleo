<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cordillera Topo Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: the same frame as the plant view. A top bar holds the title with one line saying how the
   company (or the site) is doing, the actions and the site selector. A left pane, collapsible to a
   rail, ranks the sites (or a site's wells) by oil production and holds the legend and the data
   source. The map fills the rest: a contour map with oil production drawn live as contour bands.
   Colours, type and spacing follow the Signal design system: production on the blue sequential
   scale, problems in orange with a word, the hovered site or well in the highlight blue. */
:root {
  color-scheme: light;
  /* Signal tokens (light theme) */
  --surface: #ffffff;
  --surface-muted: #f4f5f7;
  --ink: #0f1b2d;
  --ink-muted: #4a5565;
  --ink-subtle: #636b78;
  --gridline: #e6e9ed;
  --axis: #89929e;
  --highlight: #1f4fe0;
  --highlight-soft: #e8effd;
  --on-highlight: #ffffff;
  --delta-bad: #c2410c;
  --watch: #b4530f;                    /* div-neg-2: watch, darker than the orange band so it reads as text */
  --context: #89929e;
  --context-soft: #c3c9d1;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
  --radius-md: 6px;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --bar-h: 68px;
  --rail-w: 52px;
  --pane-w: 296px;
  /* status colours used by the shared tooltips (common.js) */
  --good: var(--context); --warning: #eaa56a; --critical: var(--delta-bad); --planned: var(--context-soft);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface); color: var(--ink); font-family: var(--font); font-variant-numeric: tabular-nums; overflow: hidden; }
.kicker { margin: 0; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-subtle); }
.source { margin: 0; font-size: 11px; line-height: 14px; color: var(--ink-subtle); }

/* ---------------------------------------------------------------- top bar */
header.bar { position: fixed; top: 0; left: 0; right: 0; height: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) max(var(--space-6), env(safe-area-inset-right, 0px)) 0 max(var(--space-6), env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: var(--space-4); background: var(--surface); border-bottom: 1px solid var(--gridline); z-index: 5; }
.titles { min-width: 0; flex: 1; display: grid; gap: 2px; }
.bar h1 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#summary { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#summary b { color: var(--delta-bad); font-weight: 600; }
#summary button { font: inherit; color: var(--ink-muted); background: none; border: 0; padding: 0; cursor: pointer; }
#summary button:hover { color: var(--ink); text-decoration: underline; }
.actions { display: flex; align-items: center; gap: var(--space-2); flex: none; }
.btn { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 14px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--axis); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn:focus-visible, .ib:focus-visible, select:focus-visible, .chip:focus-visible, .row:focus-visible { outline: 2px solid var(--highlight); outline-offset: 2px; }
.btn svg { width: 15px; height: 15px; flex: none; }
.site { display: flex; align-items: center; gap: var(--space-2); flex: none; padding-left: var(--space-4); margin-left: var(--space-2); border-left: 1px solid var(--gridline); height: 38px; }
.site select { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: var(--radius-md); padding: 0 10px; height: 38px; min-width: 220px; cursor: pointer; }
.site select:hover { border-color: var(--ink); }
#paneBtn { display: none; }

/* ---------------------------------------------------------------- left pane */
#pane { position: fixed; left: 0; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); bottom: 0; width: var(--rail-w); background: var(--surface); border-right: 1px solid var(--gridline); z-index: 4; display: flex; flex-direction: column; overflow: hidden; }
body.pane-open #pane { width: var(--pane-w); }
.rail { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-2) 0; }
.full { display: none; flex-direction: column; min-height: 0; flex: 1; }
body.pane-open .rail { display: none; }
body.pane-open .full { display: flex; }
.ib { width: 38px; height: 38px; display: grid; place-items: center; border-radius: var(--radius-md); border: 0; background: none; color: var(--ink-muted); cursor: pointer; }
.ib:hover { background: var(--surface-muted); color: var(--ink); }
.ib svg { width: 18px; height: 18px; }
.full .head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); border-bottom: 1px solid var(--gridline); min-height: 52px; }
.full .head .sub { display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.listsec { flex: 1; min-height: 0; overflow: auto; padding: var(--space-2); border-bottom: 1px solid var(--gridline); }
/* ranked list: Signal sorted bars, labelled directly; the hovered row is the highlight */
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--space-2); width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; border-radius: var(--radius-md); padding: 7px 8px 8px; cursor: pointer; }
.row:hover, .row.hl { background: var(--surface-muted); }
.row .nm { font-size: 13px; line-height: 18px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .val { font-size: 13px; line-height: 18px; font-weight: 600; text-align: right; }
.row .val small { font-weight: 400; color: var(--ink-subtle); }
.row .bar { grid-column: 1 / -1; height: 6px; background: var(--surface-muted); }
.row .bar i { display: block; height: 100%; background: var(--context-soft); }
.row:hover .bar i, .row.hl .bar i { background: var(--highlight); }
.row:hover .nm, .row.hl .nm { color: var(--highlight); }
.row .why { grid-column: 1 / -1; font-size: 11.5px; line-height: 15px; font-weight: 600; color: var(--delta-bad); }
.row .why.watch { color: var(--watch); }
.row.off .val { color: var(--ink-subtle); font-weight: 500; }
details.sec { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--gridline); display: grid; gap: var(--space-2); }
details.sec summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 24px; }
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary::after { content: "▸"; color: var(--ink-subtle); font-size: 11px; }
details.sec[open] summary::after { content: "▾"; }
.ramp { display: flex; gap: 2px; }
.ramp span { flex: 1; height: 10px; }
.ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-subtle); }
.keys { display: grid; gap: 6px; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.keys span { display: inline-flex; align-items: center; gap: var(--space-2); }
.keys i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--ink); }
.keys i.off { background: var(--surface); border: 1.5px solid var(--axis); }
.keys i.watch { background: #eaa56a; } .keys i.bad { background: var(--delta-bad); }
.keys i.sq { border-radius: 1px; }
.foot { padding: var(--space-3) var(--space-4); display: grid; gap: var(--space-1); }

/* ---------------------------------------------------------------- map */
#stage { position: fixed; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); left: var(--rail-w); right: 0; bottom: 0; overflow: hidden; background: var(--surface); }
body.pane-open #stage { left: var(--pane-w); }
#map { position: absolute; inset: 0; transition: opacity .2s ease; }
#map.out { opacity: 0; }
#base { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#over { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#over .lead { stroke: var(--axis); stroke-width: 1; fill: none; }
#over .lead.hl { stroke: var(--highlight); stroke-width: 1.5; }
#over .dot { cursor: pointer; }
#over .dot.hl { stroke: var(--highlight); stroke-width: 3; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.chip { position: absolute; pointer-events: auto; display: block; padding: 5px 10px 6px; border: 1px solid var(--axis); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; white-space: nowrap; }
.chip:hover, .chip.hl { border-color: var(--highlight); box-shadow: inset 0 0 0 1px var(--highlight); }
.chip .n { display: block; font-size: 12px; line-height: 16px; font-weight: 600; }
.chip.hl .n, .chip:hover .n { color: var(--highlight); }
.chip .v { display: block; font-size: 14px; line-height: 18px; font-weight: 600; }
.chip .v small, .tag .v small { font-size: 11px; font-weight: 400; color: var(--ink-subtle); }
.chip .why { display: block; font-size: 11px; line-height: 14px; font-weight: 600; color: var(--delta-bad); }
.chip .why.watch { color: var(--watch); }
.tag { position: absolute; pointer-events: auto; cursor: pointer; white-space: nowrap; text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff, 0 0 6px #fff, 0 0 8px #fff; }
.tag .n { font-size: 12px; line-height: 15px; font-weight: 600; }
.tag .v { font-size: 11px; line-height: 14px; font-weight: 500; color: var(--ink); }
.tag .v.bad { color: var(--delta-bad); font-weight: 600; }
.tag .v.watch { color: var(--watch); font-weight: 600; }
.tag.hl .n { color: var(--highlight); }
.tag.ref .n { font-size: 13px; }

#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); border: 1px solid var(--gridline); border-radius: var(--radius-md); padding: var(--space-3); min-width: 180px; max-width: 260px; font-size: 13px; display: grid; gap: 5px; justify-items: start; }
#tip h3 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; }
#tip .sub { color: var(--ink-subtle); font-size: 12px; margin-top: -4px; }
#tip .num { font-size: 20px; line-height: 24px; font-weight: 600; }
#tip .num small { font-size: 12px; font-weight: 400; color: var(--ink-subtle); }
#tip .why { color: var(--ink-muted); font-size: 12px; }
#tip .hint { color: var(--ink-subtle); font-size: 11px; }
#tip .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
svg.ic { width: 12px; height: 12px; flex: none; }

/* ---------------------------------------------------------------- narrow screens */
@media (max-width: 980px) { .btn .long { display: none; } .site select { min-width: 0; } }
@media (max-width: 700px) {
  /* two lines: menu, actions and site on top; the summary underneath (the select names the site) */
  :root { --bar-h: 94px; }
  header.bar { flex-wrap: wrap; align-content: center; gap: 6px var(--space-2); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  #paneBtn { display: grid; }
  .titles { order: 3; flex-basis: 100%; padding: 0 var(--space-2); }
  .bar h1 { display: none; }
  #summary { font-size: 12px; }
  .btn { padding: 0 10px; }
  .site { flex: 1; justify-content: flex-end; padding-left: var(--space-2); margin-left: 0; }
  .site .kicker { display: none; }
  .site select { width: 100%; font-size: 13px; padding: 0 6px; }
  #pane { display: none; width: min(320px, 88vw) !important; }
  body.pane-open #pane { display: flex; border-right-color: var(--axis); }
  #stage, body.pane-open #stage { left: 0; }
  .chip { padding: 3px 7px 4px; } .chip .n { font-size: 10.5px; line-height: 13px; } .chip .v { font-size: 12px; line-height: 15px; } .chip .why { font-size: 10px; }
  .tag .n { font-size: 11px; } .tag .v { font-size: 10px; }
}
</style>
</head>
<body>
<header class="bar">
  <button class="ib" id="paneBtn" type="button" aria-label="Open the site list" aria-controls="pane"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  <div class="titles"><h1 id="h1">Cordillera Petróleo</h1><p id="summary"></p></div>
  <div class="actions">
    <a class="btn" id="plant" hidden title="The site's plant, drawn from AF, with live PI values"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 15V8l4 2.5V8l4 2.5V4h5v11zM2.5 15h13" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg><span class="long">View the plant</span></a>
    <a class="btn" id="pv" target="_blank" rel="noopener" hidden aria-label="Open in PI Vision" title="Open in PI Vision"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M7.5 4H4v10h10v-3.5M10 3h5v5M15 3 8.5 9.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="long">Open in PI Vision</span></a>
  </div>
  <label class="site"><span class="kicker">Site</span><select id="site" aria-label="Site"></select></label>
</header>

<aside id="pane" aria-label="Sites ranked by oil production">
  <div class="rail">
    <button class="ib" type="button" data-open aria-label="Show the ranked list" title="Ranking"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 4.5h12M3 9h8M3 13.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="ib" type="button" data-open aria-label="Show the legend" title="Legend"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h3M3 9h3M3 13h3M8.5 5H15M8.5 9H15M8.5 13H15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </div>
  <div class="full">
    <div class="head"><div><p class="kicker" id="listTitle">Sites</p><span class="sub" id="listSub"></span></div><button class="ib" type="button" id="paneClose" aria-label="Collapse the panel" title="Collapse"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4 6 9l5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div class="listsec" id="list"></div>
    <details class="sec"><summary><span class="kicker">Legend</span></summary>
      <span class="kicker" id="rampTitle">Oil production</span>
      <div><div class="ramp" id="ramp"></div><div class="ends"><span>Low</span><span id="rampHigh">High</span></div></div>
      <span class="kicker">Marks</span><div class="keys" id="keys"></div>
    </details>
    <div class="foot"><p class="source" id="asof"></p><p class="source">Click a site to see its wells · Esc goes back · bands are relative to the busiest site or well</p></div>
  </div>
</aside>

<main id="stage">
  <div id="map">
    <canvas id="base" role="img" aria-label="Contour map with oil production drawn as contour bands"></canvas>
    <svg id="over"></svg>
    <div id="labels"></div>
  </div>
</main>
<div id="tip" hidden></div>

<script src="config.js"></script>
<script src="data/model.js"></script>
<script src="data/demo.js"></script>
<script src="data/relief.js"></script>
<script src="source.js"></script>
<script src="common.js"></script>
<script src="topo.js"></script>
</body>
</html>
