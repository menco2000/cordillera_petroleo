<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cordillera Topo Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a paper contour map fills the screen. Oil production is drawn on it as colored
   "heat contours" (6 bands, relative to the busiest site or well), computed live from PI.
   Sites carry a small chip with name and oil rate; everything else is in PI Vision.
   The map is printed-paper style, so the page stays light in dark mode too. */
:root {
  color-scheme: light;
  --sea: #e2eaf1;
  --paper: #eef2f5;
  --ink: #1f2d3a;
  --ink-2: #3c4c5a;
  --muted: #56677a;
  --chip: #ffffff;
  --watch: #c77700;
  --alert: #d03b3b;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--sea); color: var(--ink); font-family: var(--font); overflow: hidden; }
body.site { background: var(--paper); }
#map { position: fixed; inset: 0; transition: opacity .22s ease, transform .22s ease; }
#map.out { opacity: 0; transform: scale(1.04); }
#base { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#over { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#over .lead { stroke: var(--ink); stroke-width: 1; fill: none; }
#over .dot { cursor: pointer; }
#labels { position: absolute; inset: 0; pointer-events: none; }

/* fades behind header and footer in the site view, where the map covers the screen */
body.site::before, body.site::after { content: ""; position: fixed; left: 0; right: 0; pointer-events: none; z-index: 1; }
body.site::before { top: 0; height: var(--fade-top, 160px); background: linear-gradient(180deg, rgba(238,242,245,.97) 55%, rgba(238,242,245,0)); }
body.site::after { bottom: 0; height: var(--fade-bottom, 90px); background: linear-gradient(0deg, rgba(238,242,245,.97) 45%, rgba(238,242,245,0)); }

.chip { position: absolute; pointer-events: auto; display: block; padding: 4px 10px 5px; border: 1px solid var(--ink); background: var(--chip); color: var(--ink); font: inherit; text-align: left; cursor: pointer; white-space: nowrap; }
.chip:hover { background: #f4f7fa; }
.chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.chip .n { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; line-height: 1.3; }
.chip .v { font-family: var(--mono); font-size: 14px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; }
.chip .v small, .tag .v small { font-size: .72em; font-weight: 500; color: var(--muted); }
.tag { position: absolute; pointer-events: auto; cursor: default; white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 6px #fff, 0 0 2px #fff; }
.tag .n { font-size: 12px; font-weight: 700; line-height: 1.25; }
.tag .v { font-family: var(--mono); font-size: 11px; color: var(--ink-2); line-height: 1.25; }
.tag.ref .n { font-size: 13px; }
.tag .v.bad { color: var(--alert); font-weight: 600; }
svg.flag { width: 11px; height: 10px; flex: none; }

header.top { position: fixed; top: calc(28px + env(safe-area-inset-top, 0px)); left: max(32px, env(safe-area-inset-left, 0px)); right: max(32px, env(safe-area-inset-right, 0px)); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none; z-index: 2; }
header.top > * { pointer-events: auto; }
.title { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.title h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.005em; line-height: 1.15; }
.title p { margin: 0; font-size: 15px; color: var(--ink-2); }
.title p b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
.title button { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2); background: none; border: 0; padding: 0; cursor: pointer; }
.title button:hover { color: var(--ink); text-decoration: underline; }
.title a.plant { font-size: 13px; font-weight: 600; color: var(--ink); text-underline-offset: 3px; min-height: 28px; display: inline-flex; align-items: center; }
.pv { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 9px 16px; border-radius: 6px; background: #fff; border: 1.5px solid var(--ink); color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.pv:hover { background: var(--ink); color: #fff; }
.pv svg { width: 13px; height: 13px; }

footer.bottom { position: fixed; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); left: max(32px, env(safe-area-inset-left, 0px)); right: max(32px, env(safe-area-inset-right, 0px)); display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); pointer-events: none; z-index: 2; }
footer.bottom > * { pointer-events: auto; }
.legend { display: flex; flex-direction: column; gap: 6px; }
.legend .h { font-size: 13px; font-weight: 600; color: var(--ink); }
.legend .sw { display: flex; gap: 2px; }
.legend .sw span { width: 34px; height: 10px; }
.legend .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.legend .keys { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px; }
.legend .keys span { display: inline-flex; align-items: center; gap: 6px; }
.legend .keys i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); display: inline-block; }
.legend .keys i.off { background: #fff; border: 1.5px solid var(--ink); }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
#designs { display: flex; gap: 2px; padding: 3px; border-radius: 7px; background: #fff; border: 1px solid #c9d3dc; }
#designs a { color: var(--ink-2); text-decoration: none; padding: 4px 11px; border-radius: 5px; }
#designs a.on { background: var(--ink); color: #fff; font-weight: 600; }
#asof { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }

#tip { position: fixed; z-index: 10; pointer-events: none; background: #fff; border: 1px solid var(--ink); padding: 10px 12px; min-width: 170px; max-width: 260px; font-size: 13px; display: grid; gap: 5px; justify-items: start; }
#tip h3 { margin: 0; font-size: 15px; font-weight: 700; }
#tip .sub { color: var(--muted); font-size: 12px; margin-top: -4px; }
#tip .num { font-family: var(--mono); font-size: 19px; font-weight: 600; }
#tip .num small { font-family: var(--font); font-size: 12px; font-weight: 500; color: var(--ink-2); }
#tip .why, #tip .hint { color: var(--ink-2); font-size: 12px; }
#tip .hint { color: var(--muted); }
#tip .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
svg.ic { width: 12px; height: 12px; flex: none; }
:root { --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --planned: #8a96a1; }

@media (max-width: 640px) {
  header.top { top: calc(18px + env(safe-area-inset-top, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); flex-direction: column; gap: 10px; }
  .title h1 { font-size: 21px; } .title p { font-size: 13px; }
  .pv { min-height: 44px; padding: 10px 14px; font-size: 13px; }
  footer.bottom { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); }
  .legend .sw span { width: 22px; height: 8px; } .legend .h { font-size: 11px; }
  .legend .ends { display: none; }
  #designs a { padding: 4px 9px; }
  .chip { padding: 3px 8px 4px; } .chip .n { font-size: 10px; } .chip .v { font-size: 12px; }
  .tag .n { font-size: 11px; } .tag .v { font-size: 10px; } .tag.ref .n { font-size: 12px; }
}
</style>
</head>
<body>
<div id="map">
  <canvas id="base" role="img" aria-label="Contour map with oil production drawn as colored contour bands"></canvas>
  <svg id="over"></svg>
  <div id="labels"></div>
</div>
<header class="top"><div class="title" id="title"></div>
  <a class="pv" id="pv" target="_blank" rel="noopener" hidden>Open in PI Vision <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M4 10 10 4M5 4h5v5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></a></header>
<footer class="bottom"><div class="legend" id="legend"></div><div class="right"><nav id="designs" aria-label="Map designs"></nav><span id="asof"></span></div></footer>
<div id="tip" hidden></div>

<script src="config.js"></script>
<script src="data/model.js"></script>
<script src="data/demo.js"></script>
<script src="data/relief.js"></script>
<script src="source.js"></script>
<script src="common.js"></script>
<script src="topo.js"></script>
</body>
</html>
