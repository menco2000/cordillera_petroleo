<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cordillera Plant View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a top bar holds the title with a one-line status summary (or the AF path of the selection),
   the two actions and the site selector. The AF hierarchy and the legend live in a left pane that
   collapses to a thin rail; the selected element's PI values open on the right (a sheet on phones).
   The drawing is a flat isometric SVG built from the AF hierarchy, in an industrial style.
   Colours, type and spacing follow the Signal design system: one highlight colour (blue) for the
   selection, problems in orange with a word, everything else neutral grey. */
:root {
  color-scheme: light;
  /* Signal tokens (light theme) */
  --surface: #ffffff;
  --surface-muted: #f4f5f7;
  --ink: #0f1b2d;
  --ink-muted: #4a5565;
  --ink-subtle: #636b78;
  --gridline: #e6e9ed;
  --axis: #89929e;
  --highlight: #1f4fe0;
  --highlight-soft: #e8effd;          /* seq-1 */
  --on-highlight: #ffffff;
  --delta-bad: #c2410c;
  --context: #89929e;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
  --radius-md: 6px;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  /* page */
  --canvas: #ecebe6;                  /* concrete, behind the industrial drawing */
  --bar-h: 68px;
  --rail-w: 52px;
  --pane-w: 296px;
  /* drawing lines */
  --stroke: #1b2026; --slab-stroke: #9b978d; --stroke-w: 1.25;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--canvas); color: var(--ink); font-family: var(--font); font-variant-numeric: tabular-nums; overflow: hidden; }
.kicker { margin: 0; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-subtle); }
.source { margin: 0; font-size: 11px; line-height: 14px; color: var(--ink-subtle); }

/* ---------------------------------------------------------------- top bar */
header.bar { position: fixed; top: 0; left: 0; right: 0; height: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) max(var(--space-6), env(safe-area-inset-right, 0px)) 0 max(var(--space-6), env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: var(--space-4); background: var(--surface); border-bottom: 1px solid var(--gridline); z-index: 5; }
.titles { min-width: 0; flex: 1; display: grid; gap: 2px; }
.bar h1 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#summary { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#summary b { color: var(--delta-bad); font-weight: 600; }
.crumbs { font-size: 13px; line-height: 18px; color: var(--ink-muted); display: flex; flex-wrap: nowrap; gap: 2px 5px; align-items: center; overflow: hidden; white-space: nowrap; }
.crumbs button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.crumbs button:hover { color: var(--ink); text-decoration: underline; }
.crumbs button:last-child { color: var(--ink); font-weight: 600; }
.crumbs span { color: var(--ink-subtle); }
.actions { display: flex; align-items: center; gap: var(--space-2); flex: none; }
.btn { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 14px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--axis); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn:focus-visible, .ib:focus-visible, select:focus-visible { outline: 2px solid var(--highlight); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--highlight); border-color: var(--highlight); color: var(--on-highlight); }
.btn svg { width: 15px; height: 15px; flex: none; }
.site { display: flex; align-items: center; gap: var(--space-2); flex: none; padding-left: var(--space-4); margin-left: var(--space-2); border-left: 1px solid var(--gridline); height: 38px; }
.site select { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: var(--radius-md); padding: 0 10px; height: 38px; min-width: 220px; cursor: pointer; }
.site select:hover { border-color: var(--ink); }
#paneBtn { display: none; }

/* ---------------------------------------------------------------- left pane */
#pane { position: fixed; left: 0; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); bottom: 0; width: var(--rail-w); background: var(--surface); border-right: 1px solid var(--gridline); z-index: 4; display: flex; flex-direction: column; overflow: hidden; }
body.pane-open #pane { width: var(--pane-w); }
.rail { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-2) 0; }
.full { display: none; flex-direction: column; min-height: 0; flex: 1; }
body.pane-open .rail { display: none; }
body.pane-open .full { display: flex; }
.ib { width: 38px; height: 38px; display: grid; place-items: center; border-radius: var(--radius-md); border: 0; background: none; color: var(--ink-muted); cursor: pointer; font: inherit; font-size: 18px; }
.ib:hover { background: var(--surface-muted); color: var(--ink); }
.ib svg { width: 18px; height: 18px; }
.full .head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); border-bottom: 1px solid var(--gridline); min-height: 52px; }
.sec { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--gridline); display: grid; gap: var(--space-2); }
.treesec { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 1px solid var(--gridline); }
#treeBody { overflow: auto; flex: 1; padding: var(--space-2) var(--space-2) var(--space-3); }
#treeBody ul { list-style: none; margin: 0; padding: 0 0 0 12px; }
#treeBody > ul { padding-left: 0; }
#treeBody li > div { display: flex; align-items: center; }
#treeBody .tw { width: 22px; height: 28px; flex: none; background: none; border: 0; color: var(--ink-subtle); cursor: pointer; font-size: 9px; padding: 0; }
#treeBody .tw:disabled { cursor: default; }
#treeBody .nm { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; text-align: left; font: inherit; font-size: 13px; line-height: 18px; color: var(--ink); background: none; border: 0; padding: 5px 8px; border-radius: var(--radius-md); cursor: pointer; overflow: hidden; }
#treeBody .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#treeBody .nm em { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 600; color: var(--delta-bad); white-space: nowrap; }
#treeBody .nm:hover { background: var(--surface-muted); }
#treeBody .nm.on { background: var(--highlight-soft); color: var(--highlight); font-weight: 600; box-shadow: inset 2px 0 0 var(--highlight); }
#treeBody .nm i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: transparent; }
#treeBody li.closed > ul { display: none; }
details.sec summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 24px; }
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary::after { content: "▸"; color: var(--ink-subtle); font-size: 11px; }
details.sec[open] summary::after { content: "▾"; }
.legend, #statusLegend { display: grid; grid-template-columns: 1fr; gap: 6px; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.legend span, #statusLegend span { display: inline-flex; align-items: center; gap: var(--space-2); }
.legend i { width: 18px; height: 6px; display: inline-block; flex: none; }
#statusLegend b { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.foot { padding: var(--space-3) var(--space-4); display: grid; gap: var(--space-1); }

/* ---------------------------------------------------------------- drawing */
#stage { position: fixed; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); left: var(--rail-w); right: 0; bottom: 0; overflow: hidden; background: var(--canvas); }
body.pane-open #stage { left: var(--pane-w); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; user-select: none; transform-origin: 0 0; will-change: transform; }
#scene:active { cursor: grabbing; }
#scene .o { stroke: var(--stroke); stroke-width: var(--stroke-w); vector-effect: non-scaling-stroke; stroke-linejoin: round; }
#scene .slab.o { stroke: var(--slab-stroke); }
#scene .po { stroke: var(--stroke); fill: none; }
#scene path:not(.o) { fill: none; }
#scene .pd { stroke-dasharray: 1.1px 2.3px; stroke-dashoffset: var(--o0); }
#scene.moving .pd { animation: flow var(--dur) steps(4) infinite; }
@keyframes flow { from { stroke-dashoffset: var(--o0); } to { stroke-dashoffset: calc(var(--o0) - 3.4px); } }
@media (prefers-reduced-motion: reduce) { #scene.moving .pd { animation: none; } }
#scene.focus [data-pipe]:not(.on) { opacity: .22; }
#scene .hov .o { stroke: #7a9ff0; stroke-width: 2; }
#scene .sel .o { stroke: var(--highlight); stroke-width: 2.6; }
#scene .lab { font-family: var(--font); font-weight: 600; font-size: calc(var(--k, 1) * 11px); fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--canvas); stroke-width: calc(var(--k, 1) * 3.5px); stroke-linejoin: round; pointer-events: none; }
#scene .lab.area { font-size: calc(var(--k, 1) * 11.5px); text-transform: uppercase; letter-spacing: .06em; }
#scene .lab.wc { fill: var(--ink-muted); font-weight: 500; }
#scene .lab.eq, #scene .lab.wc { display: none; }
#scene[data-tier="1"] .lab.wc, #scene[data-tier="2"] .lab.wc, #scene[data-tier="2"] .lab.eq, #scene .lab.sel, #scene .lab.hov { display: inline; }
#scene[data-tier="2"] .lab.area { display: none; }
#scene .lab.sel { fill: var(--highlight); stroke: var(--surface); stroke-width: calc(var(--k, 1) * 5px); }

/* ---------------------------------------------------------------- details panel */
#info { position: fixed; z-index: 3; right: max(var(--space-4), env(safe-area-inset-right, 0px)); top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + var(--space-4)); width: 320px; max-height: calc(100% - var(--bar-h) - 32px); background: var(--surface); border: 1px solid var(--gridline); border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden; }
#info .ihead { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); border-bottom: 1px solid var(--gridline); }
#info .ihead span { font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-subtle); }
#info .body { overflow: auto; }
#info .sec h3 { margin: 0; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-subtle); }
#info h2 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; }
#info .meta { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
#info .sec:last-child { border-bottom: 0; }
#info table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 18px; }
#info td { padding: 3px 0; vertical-align: top; border-bottom: 1px solid var(--surface-muted); }
#info tr:last-child td { border-bottom: 0; }
#info td:first-child { color: var(--ink-muted); padding-right: var(--space-3); }
#info td:last-child { text-align: right; font-weight: 600; white-space: nowrap; }
#info td small { font-weight: 400; color: var(--ink-subtle); }
#info .kids { display: flex; flex-wrap: wrap; gap: 6px; }
#info .kids button { font: inherit; font-size: 12px; background: var(--surface); border: 1px solid var(--gridline); border-radius: var(--radius-md); padding: 4px 9px; cursor: pointer; color: var(--ink); }
#info .kids button:hover { border-color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.pill i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); border: 1px solid var(--gridline); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); font-size: 12px; line-height: 16px; color: var(--ink-muted); max-width: 260px; }
#tip b { display: block; font-size: 13px; color: var(--ink); }
#tip span { color: var(--ink); font-weight: 600; }
#err { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--surface); border: 1px solid var(--gridline); border-radius: var(--radius-md); padding: var(--space-4); max-width: 420px; font-size: 14px; z-index: 20; }

/* ---------------------------------------------------------------- narrow screens */
@media (max-width: 980px) { .btn .long { display: none; } .site select { min-width: 0; } }
@media (max-width: 700px) {
  /* two lines: menu, actions and site on top; the summary / AF path underneath (the select names the site) */
  :root { --bar-h: 94px; }
  header.bar { flex-wrap: wrap; align-content: center; gap: 6px var(--space-2); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  #paneBtn { display: grid; }
  .titles { order: 3; flex-basis: 100%; padding: 0 var(--space-2); }
  .bar h1 { display: none; }
  .site { flex: 1; justify-content: flex-end; }
  #summary, .crumbs { font-size: 12px; }
  .btn { padding: 0 10px; }
  .site { padding-left: var(--space-2); margin-left: 0; }
  .site .kicker { display: none; }
  .site select { width: 100%; max-width: none; font-size: 13px; padding: 0 6px; }
  #pane { display: none; width: min(320px, 88vw) !important; }
  body.pane-open #pane { display: flex; border-right-color: var(--axis); }
  #stage, body.pane-open #stage { left: 0; }
  #info { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 46%; border-radius: 0; border-width: 1px 0 0; }
  #scene .lab.area { font-size: calc(var(--k, 1) * 9.5px); letter-spacing: .03em; }
}
</style>
</head>
<body>
<header class="bar">
  <button class="ib" id="paneBtn" type="button" aria-label="Open the AF hierarchy" aria-controls="pane"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  <div class="titles">
    <h1 id="h1">Plant</h1>
    <p id="summary"></p>
    <nav class="crumbs" id="crumbs" aria-label="AF path" hidden></nav>
  </div>
  <div class="actions">
    <button class="btn" type="button" id="motion" aria-pressed="false" aria-label="Animate flows" title="Animate the flow direction in the pipes"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 7c2-2 4 2 6.5 0s4.5 2 6.5 0M2.5 11.5c2-2 4 2 6.5 0s4.5 2 6.5 0" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span class="long">Animate flows</span></button>
    <a class="btn" id="pv" target="_blank" rel="noopener" aria-label="Open in PI Vision" title="Open the selected element in PI Vision"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M7.5 4H4v10h10v-3.5M10 3h5v5M15 3 8.5 9.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="long">Open in PI Vision</span></a>
  </div>
  <label class="site"><span class="kicker">Site</span><select id="site" aria-label="Site"></select></label>
</header>

<aside id="pane" aria-label="AF hierarchy and legend">
  <div class="rail">
    <button class="ib" type="button" data-open aria-label="Show the AF hierarchy" title="AF hierarchy"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 3v12M4 6h5M4 12h5M11 6h4M11 12h4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
    <button class="ib" type="button" data-open aria-label="Show the legend" title="Legend"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h3M3 9h3M3 13h3M8.5 5H15M8.5 9H15M8.5 13H15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </div>
  <div class="full">
    <div class="head"><p class="kicker">AF hierarchy</p><button class="ib" type="button" id="paneClose" aria-label="Collapse the panel" title="Collapse"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4 6 9l5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div class="treesec"><div id="treeBody"></div></div>
    <details class="sec" id="legendSec"><summary><span class="kicker">Legend</span></summary>
      <span class="kicker">Pipes</span><div class="legend" id="legend"></div>
      <span class="kicker">Status</span><div id="statusLegend"></div>
    </details>
    <div class="foot"><p class="source" id="asof"></p><p class="source">Drag to pan · scroll or pinch to zoom · click to select · Esc goes up · double-click to see the whole site</p></div>
  </div>
</aside>

<main id="stage"><svg id="scene" tabindex="0" role="img" aria-label="Isometric drawing of the site's plant. Drag to pan, scroll or pinch to zoom, arrow keys to pan, plus and minus to zoom." xmlns="http://www.w3.org/2000/svg"></svg></main>
<aside id="info" aria-live="polite" hidden><div class="ihead"><span id="infoKind">Element</span><button class="ib" type="button" id="infoClose" aria-label="Close details">×</button></div><div class="body" id="infoBody"></div></aside>
<div id="tip" hidden></div>
<div id="err" hidden></div>

<script src="config.js"></script>
<script src="data/model.js"></script>
<script src="data/demo.js"></script>
<script src="data/plant.js"></script>
<script src="source.js"></script>
<script src="common.js"></script>
<script type="module" src="plant.js"></script>
</body>
</html>
