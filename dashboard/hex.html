<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cordillera Hex Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: South America as a field of hexagons on near-black. Cells light up around each site
   (hue = status, reach = production) and a callout chip names each site with one number.
   A one-line header and a footer are the only other chrome; details live in PI Vision. One dark look. */
:root {
  color-scheme: dark;
  --bg: #07071a;
  --cell: #1b1c46;
  --ink: #ffffff;
  --ink-2: #b9bbe0;
  --muted: #7a7cab;
  --chip: rgba(8, 8, 26, 0.88);
  --good: #3b82ff;
  --warning: #ffa53b;
  --critical: #ff3d7f;
  --planned: #6d6f9c;
  --violet: #a35bff;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#map g { transition: opacity .6s; }
#map { z-index: 0; } #chips { z-index: 2; }
.arc { fill: none; stroke: url(#arcGrad); stroke-width: 2; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 3 7; animation: arc 1.4s linear infinite; }
@keyframes arc { to { stroke-dashoffset: -20; } }
#chips { position: fixed; inset: 0; pointer-events: none; }
.callout { position: absolute; pointer-events: auto; display: flex; align-items: center; gap: 9px; padding: 7px 12px 7px 7px; border-radius: 10px;
  background: var(--chip); box-shadow: 0 6px 20px rgba(0,0,0,.45); cursor: pointer; white-space: nowrap; border: 0; color: inherit; font: inherit; text-align: left; transform: translate(0, -100%); }
.callout:hover, .callout:focus-visible { outline: 1.5px solid rgba(255,255,255,.5); }
.callout .ico { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.callout .ico svg { width: 18px; height: 18px; }
.callout small { display: block; font-size: .66rem; color: var(--ink-2); line-height: 1.2; }
.callout b { display: block; font-size: .98rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
.callout.well { padding: 5px 10px 5px 5px; gap: 7px; }
.callout.well .ico { width: 24px; height: 24px; border-radius: 6px; }
.callout.well .ico svg { width: 13px; height: 13px; }
.callout.well b { font-size: .84rem; }
.stem { position: absolute; width: 1.5px; background: rgba(255,255,255,.5); transform-origin: top; pointer-events: none; }

header.top { position: fixed; z-index: 3; top: calc(22px + env(safe-area-inset-top, 0px)); left: max(24px, env(safe-area-inset-left, 0px)); right: max(24px, env(safe-area-inset-right, 0px)); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none; }
header.top > * { pointer-events: auto; }
.title h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
.title p { margin: 2px 0 0; font-size: .92rem; color: var(--ink-2); }
.title p b { color: #fff; font-variant-numeric: tabular-nums; }
.title button { font: inherit; font-size: .8rem; font-weight: 600; color: var(--ink-2); background: none; border: 0; padding: 0; margin-bottom: 4px; cursor: pointer; letter-spacing: .04em; }
.title button:hover { color: #fff; }
.pv { display: inline-flex; align-items: center; gap: 7px; font-size: .84rem; font-weight: 600; color: #fff; background: linear-gradient(90deg, var(--violet), var(--good)); border-radius: 10px; padding: 9px 14px; text-decoration: none; white-space: nowrap; }
.pv:hover { filter: brightness(1.1); }
footer.bottom { position: fixed; z-index: 3; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: max(24px, env(safe-area-inset-left, 0px)); right: max(24px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 10px 18px; flex-wrap: wrap; font-size: .76rem; color: var(--ink-2); pointer-events: none; }
footer.bottom > * { pointer-events: auto; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
#designs { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--chip); }
#designs a { color: var(--ink-2); text-decoration: none; padding: 4px 11px; border-radius: 7px; }
#designs a.on { color: #fff; background: linear-gradient(90deg, var(--violet), var(--good)); font-weight: 600; }
#asof { color: var(--muted); font-variant-numeric: tabular-nums; }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--chip); border-radius: 12px; padding: 11px 13px; min-width: 170px; max-width: 260px; font-size: .8rem; box-shadow: 0 10px 30px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.08); display: grid; gap: 5px; justify-items: start; }
#tip h3 { margin: 0; font-size: .98rem; font-weight: 600; }
#tip .sub { color: var(--muted); font-size: .74rem; margin-top: -4px; }
#tip .num { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
#tip .num small { font-size: .76rem; font-weight: 500; color: var(--ink-2); }
#tip .why { color: var(--ink-2); font-size: .74rem; }
#tip .hint { color: var(--muted); font-size: .7rem; }
svg.ic { width: 12px; height: 12px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px; background: rgba(255,255,255,.08); white-space: nowrap; }
@media (max-width: 640px) {
  .title h1 { font-size: 1.15rem; } .title p { font-size: .82rem; } header.top { flex-direction: column; } .pv { padding: 7px 11px; font-size: .78rem; }
  footer.bottom { justify-content: center; } #asof { width: 100%; text-align: center; order: 3; }
  .callout { padding: 4px 8px 4px 4px; gap: 6px; border-radius: 8px; } .callout .ico { width: 22px; height: 22px; border-radius: 6px; } .callout .ico svg { width: 12px; height: 12px; }
  .callout small { font-size: .62rem; } .callout b { font-size: .78rem; }
}
@media (prefers-reduced-motion: reduce) { .arc { animation: none; } }
</style>
</head>
<body>
<svg id="map" role="img" aria-label="Hexagon map of Cordillera Petróleo sites"></svg>
<div id="chips"></div>
<header class="top"><div class="title" id="title"></div><a class="pv" id="pv" target="_blank" rel="noopener" hidden>Open in PI Vision ↗</a></header>
<footer class="bottom"><div class="legend" id="legend"></div><nav id="designs" aria-label="Map designs"></nav><span id="asof"></span></footer>
<div id="tip" hidden></div>

<script src="config.js"></script>
<script src="data/model.js"></script>
<script src="data/map.js"></script>
<script src="data/demo.js"></script>
<script src="source.js"></script>
<script src="common.js"></script>
<script src="hex.js"></script>
</body>
</html>
