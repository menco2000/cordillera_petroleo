<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cordillera Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600&display=swap">
<style>
/* Layout: executive operations view. Header + KPI strip, then map (left) beside a ranked
   list or well table (right), then the 30-day trend beside the production-stops log.
   Clicking a site animates the map from the continent down to that site's wellfield. */
:root {
  --bg: #edf0f3;
  --surface: #ffffff;
  --sunk: #f4f6f8;
  --ink: #101820;
  --ink-2: #4b5864;
  --muted: #6c7884;
  --line: #d8dee4;
  --accent: #0b6f8f;
  --accent-soft: #e1f0f5;
  --sea: #d9e5ee;
  --land: #f8f9fa;
  --land-other: #eef1f3;
  --border-land: #aebbc6;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --planned: #8a96a1;
  --ring: #ffffff;
  --display: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1116; --surface: #141b22; --sunk: #10161c; --ink: #e7edf2; --ink-2: #b4c0ca; --muted: #8796a3;
    --line: #26323d; --accent: #4fb3d4; --accent-soft: #11313d; --sea: #0e1820; --land: #1c2731;
    --land-other: #161f27; --border-land: #3a4a58; --series-1: #3987e5; --series-2: #d95926;
    --planned: #7d8a96; --ring: #141b22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1116; --surface: #141b22; --sunk: #10161c; --ink: #e7edf2; --ink-2: #b4c0ca; --muted: #8796a3;
  --line: #26323d; --accent: #4fb3d4; --accent-soft: #11313d; --sea: #0e1820; --land: #1c2731;
  --land-other: #161f27; --border-land: #3a4a58; --series-1: #3987e5; --series-2: #d95926;
  --planned: #7d8a96; --ring: #141b22; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.app { max-width: 1480px; margin: 0 auto; padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: 0.005em; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.brand h1 { font-size: 1.25rem; font-weight: 600; }
.brand .sub { font-size: 0.8rem; color: var(--muted); }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; flex: 1 1 260px; min-width: 0; }
.crumbs button { border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; color: var(--accent); font-weight: 600; }
.crumbs button:hover { background: var(--accent-soft); }
.crumbs .here { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs .sep { color: var(--muted); }
.meta { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap; }
.src { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.src i { width: 7px; height: 7px; border-radius: 50%; background: var(--planned); display: inline-block; }
.src.live i { background: var(--good); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.banner { font-size: 0.82rem; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 10px; display: grid; gap: 2px; min-width: 0; }
.kpi .label { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
.kpi .value { font-family: var(--display); font-size: 1.9rem; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .value small { font-size: 0.95rem; color: var(--muted); font-weight: 500; margin-left: 3px; }
.kpi .foot { font-size: 0.8rem; color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 1.2em; }
.kpi svg.spark { width: 100%; height: 26px; display: block; margin-top: 4px; }
.delta-up { color: var(--good); } .delta-down { color: var(--critical); }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .value { font-size: 1.5rem; } }

/* main grid */
.main, .lower { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 980px) { .main, .lower { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 16px 6px; flex-wrap: wrap; }
.card > header h2 { font-size: 1.05rem; font-weight: 600; }
.card > header .hint { font-size: 0.78rem; color: var(--muted); }
.card .body { padding: 6px 16px 14px; }

/* map */
.mapwrap { position: relative; height: 600px; border-radius: 0 0 12px 12px; overflow: hidden; background: var(--sea); }
@media (max-width: 980px) { .mapwrap { height: 460px; } }
#map { width: 100%; height: 100%; display: block; touch-action: manipulation; }
#map .land { fill: var(--land-other); stroke: var(--border-land); stroke-width: 0.6px; vector-effect: non-scaling-stroke; }
#map .land.sa { fill: var(--land); }
#map .site { cursor: pointer; }
#map .site circle.halo { fill: transparent; }
#map .lbl { fill: var(--ink); font-family: var(--body); font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-linejoin: round; }
#map .lbl2 { fill: var(--ink-2); font-family: var(--body); font-weight: 500; paint-order: stroke; stroke: var(--surface); stroke-linejoin: round; }
#map .flow { stroke: var(--muted); stroke-dasharray: 3 4; fill: none; vector-effect: non-scaling-stroke; opacity: 0.55; }
#map .refinery { fill: var(--ink); stroke: var(--ring); }
.legend-map { position: absolute; left: 12px; bottom: 12px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 0.76rem; display: grid; gap: 4px; color: var(--ink-2); }
.legend-map .row { display: flex; align-items: center; gap: 6px; }
.scalebar { position: absolute; right: 12px; bottom: 12px; font-size: 0.72rem; color: var(--ink-2); text-align: center; }
.scalebar div { height: 6px; border: 1.5px solid var(--ink-2); border-top: 0; margin-bottom: 2px; }
.map-tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 0.8rem; box-shadow: 0 6px 20px rgba(0,0,0,.14); min-width: 170px; z-index: 5; }
.map-tip b { font-size: 0.9rem; }
.map-tip .kv { display: grid; grid-template-columns: auto auto; gap: 1px 12px; margin-top: 4px; }
.map-tip .kv span:nth-child(odd) { color: var(--muted); }
.map-tip .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* status */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.76rem; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
svg.ic { width: 12px; height: 12px; flex: none; }

/* site list */
.sites { display: grid; }
.site-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.4fr) 64px 58px; gap: 12px; align-items: center; padding: 10px 16px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
.site-row:hover { background: var(--sunk); }
.site-row .nm { font-weight: 600; font-size: 0.95rem; }
.site-row .sub { font-size: 0.76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site-row .why { font-size: 0.74rem; color: var(--ink-2); margin-top: 2px; }
.bar { height: 10px; background: var(--sunk); border-radius: 0 4px 4px 0; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--series-1); }
.barval { font-size: 0.8rem; font-weight: 600; margin-top: 3px; }
.cell-r { text-align: right; font-variant-numeric: tabular-nums; }
.cell-r small { display: block; font-size: 0.7rem; color: var(--muted); font-weight: 400; }
.list-head { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.4fr) 64px 58px; gap: 12px; padding: 4px 16px 6px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
@media (max-width: 520px) { .site-row, .list-head { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 54px; } .site-row > :nth-child(4), .list-head > :nth-child(4) { display: none; } }

/* site view */
.units { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 4px 16px 14px; }
@media (max-width: 520px) { .units { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.unit { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
.unit .u-name { font-size: 0.78rem; color: var(--ink-2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .u-val { font-family: var(--display); font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.unit .u-val small { font-size: 0.75rem; color: var(--muted); font-weight: 500; margin-left: 2px; }
.unit .u-note { font-size: 0.72rem; color: var(--muted); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.r, td.r { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: default; }
tbody tr.hl { background: var(--accent-soft); }
td svg.spark { width: 72px; height: 22px; display: block; }
.section-label { padding: 6px 16px 4px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }

/* trend */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 260px; }
.chart .grid line { stroke: var(--line); }
.chart .axis text { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart .cap { stroke: var(--muted); stroke-dasharray: 4 4; }
.chart .cross { stroke: var(--ink-2); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 0.8rem; box-shadow: 0 6px 20px rgba(0,0,0,.14); min-width: 170px; }
.tip .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .row b { font-variant-numeric: tabular-nums; }
.tip .key { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip .key i { width: 14px; height: 2px; display: inline-block; border-radius: 1px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--ink-2); padding: 0 16px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 8px); height: 1.5px; }

/* events */
.events td .reason { color: var(--ink-2); }
.empty { padding: 16px; color: var(--muted); font-size: 0.85rem; }
.loading { opacity: 0.55; transition: opacity .2s; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3 L27 25 H3 Z" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/><path d="M15 12 C12 16 12 19 15 21 C18 19 18 16 15 12 Z" fill="var(--accent)"/></svg>
      <div><h1>Cordillera Petróleo</h1><div class="sub">Operations overview · South America</div></div>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
    <div class="meta"><span class="src" id="src"><i></i><span>Connecting…</span></span><span id="asof"></span><button class="btn" id="refresh" type="button">Refresh</button></div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <section class="kpis" id="kpis" aria-label="Key figures"></section>

  <section class="main">
    <div class="card">
      <header><h2 id="map-title">Sites</h2><span class="hint" id="map-hint">Select a site to see its wells</span></header>
      <div class="mapwrap" id="mapwrap">
        <svg id="map" role="img" aria-label="Map of sites"></svg>
        <div class="legend-map" id="map-legend"></div>
        <div class="scalebar" id="scalebar" hidden><div></div><span></span></div>
        <div class="map-tip" id="map-tip" hidden></div>
      </div>
    </div>
    <div class="card" id="side"></div>
  </section>

  <section class="lower">
    <div class="card">
      <header><h2 id="trend-title">Production and refining, last 30 days</h2><button class="btn" id="trend-table-btn" type="button">Show table</button></header>
      <div class="legend" id="trend-legend"></div>
      <div class="body chart" id="trend"></div>
      <div class="tablewrap" id="trend-table" hidden></div>
    </div>
    <div class="card">
      <header><h2>Production stops</h2><span class="hint">Completed extraction runs, last 7 days</span></header>
      <div class="tablewrap events" id="events"></div>
    </div>
  </section>
</div>

<script src="config.js"></script>
<script src="data/model.js"></script>
<script src="data/map.js"></script>
<script src="data/demo.js"></script>
<script src="source.js"></script>
<script src="app.js"></script>
</body>
</html>
