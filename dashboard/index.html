<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cordillera Operations Map</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600&display=swap">
<style>
/* Layout: one full-screen satellite map. Small glass chips float over it (title/back, data source,
   legend); everything else lives in hover tooltips. Single dark look on purpose: it sits on imagery. */
:root {
  color-scheme: dark;
  --glass: rgba(10, 16, 22, 0.78);
  --glass-line: rgba(255, 255, 255, 0.14);
  --ink: #f2f5f7;
  --ink-2: #c4ced6;
  --muted: #8f9ca7;
  --accent: #6cc6e6;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --planned: #8a96a1;
  --sea: #0b1620;
  --display: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--sea); color: var(--ink); font-family: var(--body); font-size: 14px; overflow: hidden; }
#map { position: fixed; inset: 0; background: var(--sea); }
.leaflet-container { font-family: var(--body); background: var(--sea); }
.leaflet-control-attribution { background: rgba(10,16,22,.6) !important; color: var(--muted) !important; font-size: 10px; }
.leaflet-control-attribution a { color: var(--ink-2) !important; }
.leaflet-bar a { background: var(--glass) !important; color: var(--ink) !important; border-color: var(--glass-line) !important; }

.chip { position: fixed; z-index: 1000; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 12px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 8px 28px rgba(0,0,0,.35); }
#title { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); padding: 10px 14px; display: grid; gap: 4px; max-width: calc(100vw - 28px); }
#title .brand { display: flex; align-items: center; gap: 9px; }
#title h1 { font-family: var(--display); font-size: 1.15rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
#title .where { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--ink-2); flex-wrap: wrap; }
#title button { font: inherit; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 2px 4px 2px 0; cursor: pointer; }
#title button:hover { text-decoration: underline; }
#status { top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); padding: 7px 11px; font-size: .78rem; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
#status i { width: 7px; height: 7px; border-radius: 50%; background: var(--planned); display: inline-block; }
#status.live i { background: var(--good); }
#legend { bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); padding: 8px 11px; font-size: .76rem; color: var(--ink-2); display: grid; gap: 4px; }
#legend .row { display: flex; align-items: center; gap: 7px; }
#note { top: calc(64px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); padding: 7px 11px; font-size: .76rem; color: var(--ink-2); max-width: min(360px, calc(100vw - 28px)); }
@media (max-width: 560px) { #status { top: auto; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); right: max(56px, env(safe-area-inset-right, 0px)); } #note { top: calc(110px + env(safe-area-inset-top, 0px)); left: 14px; right: auto; } }

svg.ic { width: 12px; height: 12px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .76rem; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--ink); white-space: nowrap; }

/* markers (Leaflet divIcons; anchor = marker center) */
.mk { position: relative; width: 0; height: 0; }
.mk .dot { position: absolute; left: calc(var(--d) / -2); top: calc(var(--d) / -2); width: var(--d); height: var(--d); border-radius: 50%;
  border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.5); transition: transform .15s; }
.mk:hover .dot, .mk.hl .dot { transform: scale(1.25); }
.mk .lbl { position: absolute; left: calc(var(--d) / 2 + 7px); top: -9px; white-space: nowrap; color: #fff; font-weight: 600; font-size: 13px; line-height: 1.15;
  text-shadow: 0 0 3px #000, 0 0 6px #000, 0 1px 2px #000; pointer-events: none; }
.mk .lbl small { display: block; font-weight: 500; font-size: 11.5px; color: #dfe7ec; }
.mk.well .lbl { font-size: 12px; top: -7px; }
.mk.ref .dot { border-radius: 4px; background: #101820; display: grid; place-items: center; }
.mk.ref .dot svg { width: 70%; height: 70%; }
.leaflet-marker-icon.mk-wrap { background: none; border: 0; }
.leaflet-marker-icon.mk-wrap:focus-visible { outline: none; }
.leaflet-marker-icon.mk-wrap:focus-visible .dot { outline: 2px solid var(--accent); outline-offset: 3px; }

/* hover tooltip */
#tip { position: fixed; z-index: 1100; pointer-events: none; padding: 10px 12px; min-width: 210px; max-width: 300px; font-size: .82rem; }
#tip h3 { margin: 0 0 4px; font-family: var(--display); font-size: 1.02rem; font-weight: 600; }
#tip .kv { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin-top: 6px; }
#tip .kv span:nth-child(odd) { color: var(--muted); }
#tip .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
#tip .units { display: grid; gap: 4px; margin-top: 6px; }
#tip .units div { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
#tip .units .m { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: .78rem; }
#tip .why { margin-top: 6px; color: var(--ink-2); font-size: .78rem; }
#tip .hint { margin-top: 6px; color: var(--muted); font-size: .74rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of Cordillera Petróleo sites and wells"></div>

<div class="chip" id="title">
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3 L27 25 H3 Z" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/><path d="M15 12 C12 16 12 19 15 21 C18 19 18 16 15 12 Z" fill="var(--accent)"/></svg>
    <h1>Cordillera Petróleo</h1>
  </div>
  <div class="where" id="where"></div>
</div>
<div class="chip" id="status"><i></i><span>Connecting…</span></div>
<div class="chip" id="note" hidden></div>
<div class="chip" id="legend"></div>
<div class="chip" id="tip" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="config.js"></script>
<script src="data/model.js"></script>
<script src="data/map.js"></script>
<script src="data/demo.js"></script>
<script src="source.js"></script>
<script src="app.js"></script>
</body>
</html>
